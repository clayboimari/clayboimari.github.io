<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text</title>
  <meta name="description" content="Placeholder description.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Date scroll wheel: slides in from the left edge on hover, or after 5s of continuous scrolling -->
  <nav class="wheel-zone" id="wheelZone" aria-label="Archive dates">
    <div class="wheel">
      <div class="wheel-window">
        <ol class="wheel-track" id="wheelTrack"></ol>
      </div>
      <span class="wheel-band" aria-hidden="true"></span>
    </div>
  </nav>

  <div class="page">

    <header class="site-header">
      <h1 class="site-title">Text</h1>
      <div class="now" aria-label="Current date and time">
        <time id="nowDate"></time>
        <time id="nowTime"></time>
      </div>
    </header>

    <!-- Banner: five boxes between two thin black lines -->
    <section class="banner" aria-label="Banner">
      <ul class="banner-list">
        <li><a class="banner-cell" href="#">text</a></li>
        <li><a class="banner-cell" href="#">text</a></li>
        <li><a class="banner-cell" href="#">text</a></li>
        <li><a class="banner-cell" href="#">text</a></li>
        <li><a class="banner-cell" href="#">text</a></li>
      </ul>
    </section>

    <div class="layout">

      <!-- Highlights: items can be pinned, renamed, added and removed -->
      <aside class="highlights" aria-labelledby="highlightsTitle">
        <div class="highlights-head">
          <h2 class="highlights-title" id="highlightsTitle">Highlights</h2>
          <button type="button" class="link-btn" id="editToggle" aria-pressed="false">Edit</button>
        </div>
        <ul class="highlight-list" id="highlightList"></ul>
        <button type="button" class="link-btn add-btn" id="addItem" hidden>Add item</button>
        <p class="note" id="editNote" hidden>Changes are saved in this browser only.</p>
      </aside>

      <!-- Blog posts: newest first, older posts as you scroll down -->
      <main class="feed" id="feed"></main>

    </div>
  </div>

  <noscript>
    <p class="noscript">This page needs JavaScript to show posts.</p>
  </noscript>

  <script src="posts.js"></script>
  <script src="script.js"></script>
</body>
</html>
