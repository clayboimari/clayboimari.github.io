<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marco Croce</title>
  <meta name="description" content="marco croce website music digital composer electro acoustic performance art.">
  <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="MEDIA/FAVICON.png">
</head>
<body>

  <!----------HEADER---------->
  <header class="site">
    <div class="header"></div>
  </header>

  <div class="nav">
      <a href="art-sux.html" class="topbar">&nbsp;art sux&nbsp;</a>
      <a href="projects.html" class="topbar">projects</a>
      <a href="index.html" class="nav-item nav-blank" aria-label="Home" title="home"><span class="blank-box"></span></a>
      <a href="about.html" class="topbar">about</a>
      <a href="reach.html" class="topbar">reach</a>
      <div class="topbar-right">
        <button type="button" class="nav-link" id="subscribeLink">subscribe</button>
      </div>
    <div></div>
  </div>
  
  <div class="clock-row">
    </nav>
    <span class="clock" id="clock"><span id="clockDate"></span> 
    <span id="clockTime"></span></span>
  </div>

  <!----------LANDING---------->
  <section class="landing" aria-label="Featured image">
    <img
      src="MEDIA/COVER-IMAGE.JPEG"
      alt="PLACEHOLDER"
      fetchpriority="high">
  </section>

  <!----------FEED+FILTERS---------->

  <div class="feed-row">FEED</div>
  
  <div class="layout">
    <aside class="sidebar" aria-label="Filter posts">
      <ul class="filter-list" id="filterList"></ul>
    </aside>

    <main class="feed" id="feed"></main>
  </div>

  <!----------FOOTER---------->
  <footer class="site-footer">
    <p class="footer-line">© 2026</p>
    <div class="footer-links">
      <a href="#">Instagram</a>
      <a href="#">YouTube</a>
      <a href="#">Contact</a>
    </div>
  </footer>

  <!----------SUBSCRIBE---------->
  <div class="subscribe-modal" id="subscribeModal" hidden>
    <div class="subscribe-inner">
      <button type="button" class="subscribe-close" id="subscribeClose" aria-label="Close">&times;</button>
      <p class="subscribe-title">Subscribe</p>
      <p class="subscribe-sub">New work, as it happens.</p>
      <form id="subscribeForm" class="subscribe-form">
        <input type="email" name="email" placeholder="email address" required>
        <button type="submit">Sign up</button>
      </form>
    </div>
  </div>

  <noscript>
    <p class="noscript">This page needs JavaScript to show posts.</p>
  </noscript>

  <script src="posts.js"></script>
  <script src="script.js"></script>
</body>
</html>
